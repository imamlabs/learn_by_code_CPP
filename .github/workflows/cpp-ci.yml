name: C++ Build & Smoke Test (W3Schools Pack)

on:
  push:
    paths:
      - '**.cpp'
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '**.cpp'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [g++, clang++]
        include:
          - os: windows-latest
            compiler: g++
          - os: windows-latest
            compiler: clang++
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up compiler
        shell: bash
        run: |
          echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV

      - name: Build all .cpp (recursive)
        shell: bash
        run: scripts/build_all.sh . build

      - name: Smoke test binaries
        shell: bash
        run: scripts/test_smoke.sh build

      - name: Upload artifacts (binaries)
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/**
          if-no-files-found: warn
